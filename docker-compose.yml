services:
  calendar:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        - VITE_CALENDAR_API_TOKEN=${CALENDAR_API_TOKEN:-default-token}

    container_name: calendar-service

    env_file: .env

    # Only reachable from the server itself; Tailscale serve forwards to it
    ports:
      - "127.0.0.1:8010:8010"

    volumes:
      - ./backend/data:/app/data
      - ./backend/logs:/app/logs

    restart: unless-stopped

    networks:
      - edith-network


networks:
  edith-network:
    name: edith-network
    driver: bridge
